# Keeps the actions in .github/workflows/ on their latest major (a runner drops old Node versions: Node 20 in 2026).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Build and test tools only (nothing of npm's is shipped): one pull request a month for all of them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        patterns: ["*"]
