<!-- entrypoints/popup/index.ts: the popup's repeated pieces (the page itself: index.html; styles: ui/panel.css). -->

<!-- One choice of a segmented control (debug mode). -->
<template data-tpl="seg-option">
  <button type="button" role="radio" aria-checked="false" data-ref="button"></button>
</template>

<!-- What the page is: host, Odoo version, database, each after its icon (ui/panel.css), the full value on hover. -->
<template data-tpl="info">
  <span class="info" data-ref="info"><span data-ref="text"></span></span>
</template>

<!-- One choice of a list (language, theme). -->
<template data-tpl="option">
  <option data-ref="option"></option>
</template>

<!-- One keyboard shortcut: its keys and what it does ("·" between two: ui/panel.css). -->
<template data-tpl="shortcut">
  <span class="shortcut"><kbd data-ref="keys"></kbd> <span data-ref="label"></span></span>
</template>
