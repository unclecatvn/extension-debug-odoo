<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Odoo Debug</title>
  <link rel="stylesheet" href="../panel.css">
</head>
<body class="popup">
  <!-- Toolbar popup (click the icon on an Odoo page) and options page (right-click → Options): the same page. -->
  <header class="pop-head">
    <img src="../icons/icon-32.png" width="22" height="22" alt="">
    <strong>Odoo Debug</strong>
    <span class="spacer"></span>
    <span id="version" class="muted"></span>
  </header>
  <section id="page" class="pop-section" hidden>
    <div class="pop-label" data-i18n="text">This page</div>
    <div id="page-info" class="mono one-line"></div>
    <button id="detach" class="chip mt" data-i18n="text">Open the Panel in Its Own Window</button>
    <div class="pop-label mt" data-i18n="text">Debug Mode</div>
    <div id="debug" class="seg" role="radiogroup" aria-label="Debug Mode" data-i18n="aria-label"></div>
    <label class="pop-check"><input type="checkbox" id="keep"> <span data-i18n="text">Keep it on for this Odoo</span></label>
  </section>
  <section class="pop-section">
    <div class="pop-label" data-i18n="text">Language</div>
    <div id="lang" class="seg" role="radiogroup"></div>
  </section>
  <section class="pop-section">
    <div class="pop-label" data-i18n="text">Theme</div>
    <select id="theme" class="pop-select" aria-label="Theme" data-i18n="aria-label"></select>
  </section>
  <section class="pop-section">
    <div class="pop-label" data-i18n="text">Shortcuts</div>
    <div class="row"><span id="shortcuts" class="grow"></span><button id="edit-shortcuts" class="chip" data-i18n="text">Change</button></div>
  </section>
  <p class="note pop-section" data-i18n="text">Tip: ⌥/Alt + click a field on the Odoo page to copy its technical name.</p>
  <script type="module" src="index.js"></script>
</body>
</html>
