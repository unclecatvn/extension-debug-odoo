<!doctype html>
<!-- The intro film, a motion piece rendered frame by frame by tools/intro.mjs (render): no screen recording, the panel's
     answers drawn here and set in motion, on the beat of the score (tools/score.mjs, 124 BPM, every cue in window.MUSIC).
       bars 0–4    the panel's button beating, rippling; it becomes the logo; the name drafted letter by letter in other
                   types, then cleaned up left to right; the tagline
       bars 4–6    the drop: what an Odoo day throws at you, a coloured slide a beat
       bars 6–8    a pill in rings, the nine tabs in it; it shrinks into the button of an Odoo page
       bars 8–10   one click, the panel springs out of it
       then        each feature: its question and answer in moving type, then its answer in the panel, drawn and animated,
                   a caption in a pill; in three acts, each its stage: light (Record, ⌥ + click, View, i18n), a moving
                   gradient (Compare, RPC, Code), dark with a grid and sparks (Security, Apps, Perf, Menus); an iris opens
                   each act, a band wipes from a question to its answer, everything beats with the score
       the end     and everything else, in one panel: dots into the button, the answers burst out as tiles, pulled back
                   in; the logo, the tagline, the button, the sticker.
     Every frame is a pure function of t: window.renderAt(t). -->
<html lang="en">

<svg width="0" height="0" style="position: absolute">
  <filter id="mb1" x="-30%" width="160%"><feGaussianBlur stdDeviation="14 0"/></filter>
  <filter id="mb2" x="-30%" width="160%"><feGaussianBlur stdDeviation="34 0"/></filter>
  <filter id="mb3" x="-30%" width="160%"><feGaussianBlur stdDeviation="70 0"/></filter>

<script type="module">
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, t) => { const k = clamp((t - a) / (b - a)); return k * k * (3 - 2 * k); };
const ease = (k) => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2);
const out = (k) => 1 - (1 - clamp(k)) ** 3;
const inq = (k) => clamp(k) ** 3;
/** A damped spring's step response u s after its start: 0 → 1, overshooting, at f Hz. */
const spring = (u, f = 2, z = .45) => {
  if (u <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u));
};
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // the same every render
const num = (v, d = 0) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const mb = (q) => (q < .04 ? '' : `url(#mb${q < .25 ? 1 : q < .55 ? 2 : 3})`); // a horizontal motion blur, by speed

// ---------- the beat (124 BPM): every scene starts on one; the score follows the cues ----------
const BPM = 124, BEAT = 60 / BPM, B = (n) => n * BEAT;
const SFX = [];
/** A sound at t s: tick, click, pop, blip (p: its pitch, a step of the scale), swish, whoosh, ding, thud, shine. */
const cue = (t, k, g = 1, p = 0) => SFX.push({ t: +t.toFixed(4), k, g, p });

function h(tag, a = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v; else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v; else n.setAttribute(k, v);
  }
  n.append(...kids.flat().filter((x) => x != null));
  return n;
}
/** A line with its *key words* in the gradient. */
const marked = (tag, text) => {
  const n = h(tag);
  text.split('*').forEach((part, i) => part && n.append(i % 2 ? h('span', { class: 'g', text: part }) : part));
  return n;
};
/** n popped in u s after its cue: a spring from scale s / offset x, y / turn r, a quick fade, a blur clearing. */
function P(n, u, o = {}) {
  if (u < 0) { n.style.opacity = 0; return; }
  const k = spring(u, o.f ?? 2.4, o.z ?? .45);
  n.style.opacity = clamp(u / (o.fade ?? .08));
  n.style.transform = `translate(${(o.x ?? 0) * (1 - k)}px, ${(o.y ?? 0) * (1 - k)}px) scale(${lerp(o.s ?? .4, 1, k)}) rotate(${(o.r ?? 0) * (1 - k)}deg)`;
  const bl = (1 - clamp(u / .22)) * (o.b ?? 0);
  n.style.filter = bl > .2 ? `blur(${bl}px)` : '';
}
const RISE = { s: 1, y: 46, f: 2, z: .62, b: 8 };
const POP = { s: .3, f: 2.6, z: .4 };
/** Collapses a row of height H, u s after it starts: its height, its opacity. */
const collapse = (n, H, u) => { const k = ease(u / .3); n.style.height = `${H * (1 - k)}px`; n.style.opacity = 1 - k; n.style.borderBottomWidth = k > .95 ? '0' : ''; };

// the tabs' icons, as the panel draws them (src/ui/panel.css: masks)
const css = await (await fetch('/src/ui/panel.css')).text();
const ICON = Object.fromEntries([...css.matchAll(/\[data-tab=(\w+)\] \{ --icon: (url\("data:image\/svg\+xml,[^"]+"\))/g)].map((m) => [m[1], m[2]]));
const ico = (tab) => { const i = h('i', { class: 'ico' }); i.style.setProperty('--icon', ICON[tab] ?? 'none'); return i; };
const TABS = [['record', 'Record'], ['view', 'View'], ['rpc', 'RPC'], ['security', 'Security'], ['translations', 'Translations'], ['apps', 'Apps'], ['menus', 'Menus'], ['perf', 'Perf'], ['code', 'Code']];
const BUG = '<svg viewBox="0 0 128 128"><g stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"><path d="M36 62 H22 M36 80 H20 M40 96 L27 106 M92 62 H106 M92 80 H108 M88 96 L101 106"/><path d="M54 38 L46 25 M74 38 L82 25"/></g><path d="M44 46 a20 17 0 0 1 40 0 z" fill="#fff"/><rect x="36" y="50" width="56" height="60" rx="28" fill="#fff"/><path d="M64 60 V100" stroke="#553250" stroke-width="6" stroke-linecap="round"/></svg>';
const mark = () => h('div', { class: 'mark', html: BUG });
/** Places a mark: its centre x, y, its size, its roundness (.5: a circle). */
const putMark = (n, x, y, size, round = .5, o = 1) => Object.assign(n.style, { left: `${x - size / 2}px`, top: `${y - size / 2}px`, width: `${size}px`, height: `${size}px`, borderRadius: `${round * 100}%`, opacity: o });
/** The centre of `n` on the stage, as laid out (measured when a scene is built: no motion on it yet), moved by dx, dy. */
const centre = (n, dx = 0, dy = 0) => { const b = n.getBoundingClientRect(); return [b.x + b.width / 2 + dx, b.y + b.height / 2 + dy]; };
const ARROW = '<svg width="40" height="46" viewBox="0 0 26 30"><path d="M3 2 L3 24 L8.6 18.8 L12.4 27.6 L16.2 26 L12.5 17.4 L20.2 17.2 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';

await document.fonts.ready;

// ---------- the acts: the stage behind the features, from these beats (on bar lines) ----------
const ACTS = [{ b: 80, look: 'color' }, { b: 120, look: 'dark' }, { b: 168, look: 'light' }];
const lookAt = (b) => ACTS.findLast((a) => b >= a.b)?.look ?? 'light';
/** The kick's pulse at T: 1 on it, falling; four to the bar, in the dark act on 1 and the "and" of 2 (half time). */
const pulse = (T) => {
  const tb = T / BEAT;
  if (lookAt(tb) !== 'dark') return Math.exp(-(tb % 1) / .14);
  const p = (tb - 16) % 4;
  return Math.max(Math.exp(-p / .16), p >= 2.5 ? Math.exp(-(p - 2.5) / .16) : 0);
};

// ---------- scenes: [b0, b1) in beats, built once, rendered from their local time ----------
const scenes = [];
function scene(b0, b1, make) {
  const root = h('div', { class: `scene on-${lookAt(b0)}` });
  $('#scenes').append(root);
  const s = { t0: B(b0), t1: B(b1), dur: B(b1 - b0), root, at: (b) => B(b0 + b) };
  s.render = make(root, s);
  scenes.push(s);
  return s;
}
/** A cursor in `root` along waypoints [beat, x, y, 'c' to click there]: it glides between them on an arc. */
function cursor(root, s, keys) {
  const n = h('div', { class: 'cursor', html: ARROW }), ring = h('i');
  n.append(ring);
  root.append(n);
  const clicks = keys.filter((k) => k[3] === 'c').map((k) => k[0]);
  for (const c of clicks) cue(s.at(c), 'click');
  return (u) => {
    const tb = u / BEAT, i = keys.findLastIndex((k) => k[0] <= tb);
    if (i < 0) { n.style.opacity = 0; return; }
    const a = keys[i], b = keys[i + 1];
    let x = a[1], y = a[2];
    if (b) {
      const e = ease((tb - a[0]) / (b[0] - a[0]));
      x = lerp(a[1], b[1], e); y = lerp(a[2], b[2], e) - Math.sin(Math.PI * e) * Math.hypot(b[1] - a[1], b[2] - a[2]) * .12;
    }
    n.style.opacity = clamp((tb - keys[0][0]) / .25);
    const c = clicks.findLast((x) => x <= tb), since = c == null ? 9 : B(tb - c);
    n.style.transform = `translate(${x}px, ${y}px)`;
    n.firstChild.style.transform = `scale(${since < .16 ? .8 : 1})`;
    ring.style.opacity = since < .5 ? 1 - since / .5 : 0;
    ring.style.transform = `scale(${.3 + since * 2.2})`;
  };
}
const caps = [];
function caption(b0, b1, text) {
  const n = h('div', { class: 'cap' }, marked('p', text));
  $('#caps').append(n);
  caps.push({ t0: B(b0), t1: B(b1), n });
}

/** A feature's answer in the panel: in from below and tilted (a spring), a slow turn and push while held, out whipped left. */
function ui(b0, b1, o, build) {
  return scene(b0, b1, (root, s) => {
    const inner = build(root, s);
    cue(s.t1 - B(.6), 'swish');
    return (u) => {
      const k = spring(u, 1.2, .62), p = clamp(u / s.dur), e = inq((u - (s.dur - B(.6))) / B(.6));
      const rx = lerp(36, o.rx ?? 6, k), ry = lerp(o.ry0 ?? -12, o.ry1 ?? 9, ease(p)) - 25 * e;
      const sc = lerp(.7, 1, k) * lerp(1, o.push ?? 1.06, p) * (1 + .014 * pulse(s.t0 + u)); // it beats with the kick
      root.style.opacity = clamp(u / .12);
      root.style.transform = `perspective(2200px) translate(${-2400 * e}px, ${lerp(260, 0, k)}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc})`;
      root.style.filter = mb(e);
      inner(u);
    };
  });
}

/** A band sweeping across the frame around beat b (covering it at b), in the act's colours: from a question to its answer. */
const wipes = [];
function wipe(b) {
  const look = lookAt(b), n = h('div', { class: 'wipe' });
  n.style.background = look === 'dark' ? 'linear-gradient(90deg, transparent, #ff7ac3 12%, #6b3fa0 50%, #3ef0c0 88%, transparent)'
    : look === 'color' ? 'linear-gradient(90deg, transparent, #fff 10%, #fff 90%, transparent)' : 'linear-gradient(90deg, transparent, #b3548f 10%, #714b67 50%, #0e9474 90%, transparent)';
  $('#fx').append(n);
  wipes.push({ t: B(b), n });
  cue(B(b) - B(.35), 'swish', .9);
}

/** A question and its answer in moving type; `style`: how they come (scatter, type, drop, slam, zoom, pill, giant, glitch, mask). */
function headline(b0, b1, style, q, a) {
  wipe(b1);
  return scene(b0, b1, (root, s) => {
    const box = h('div', { class: 'hl' }), h2 = h('h2'), aw = h('div', { class: 'aw' }), ans = h('span', { class: 'g', text: a });
    const words = q.split(' ').map((w) => h('span', { text: w }));
    aw.append(ans);
    box.append(h2, aw);
    root.append(box);
    const zoom = style === 'zoom';
    cue(s.t1 - B(zoom ? 1.4 : .5), 'whoosh');
    let typed, pill, sel;
    if (style === 'type') {
      typed = h('span'); h2.append(typed, h('i', { class: 'caret' }));
      aw.style.overflow = 'hidden'; // the answer slides up out of it
      for (let i = 0; i < q.length; i += 2) cue(s.at(.15 + 1.2 * i / q.length), 'tick', .8);
      cue(s.at(1.6), 'pop', 1, 4);
    } else if (style === 'pill') {
      pill = h('div', { class: 'darkpill', text: q });
      h2.replaceWith(pill);
      cue(s.at(.2), 'swish'); cue(s.at(1.5), 'pop', 1, 4);
    } else {
      h2.append(...words);
      if (zoom) {
        h2.style.fontSize = '72px'; h2.className = 'qs';
        sel = h('span', { class: 'box' }); ans.replaceWith(sel); sel.append(ans);
        const frame = h('i', { class: 'sel', style: 'inset: -4px -10px' });
        for (const [x, y] of [[0, 0], [1, 0], [0, 1], [1, 1]]) frame.append(h('i', { style: `left: calc(${x * 100}% - 7px); top: calc(${y * 100}% - 7px)` }));
        sel.append(frame);
        cue(s.at(.9), 'pop', 1, 4);
      } else if (style === 'slam' || style === 'giant') cue(s.at(style === 'giant' ? 1.75 : .95), 'thud');
      else if (style === 'glitch') { cue(s.at(0), 'glitch'); cue(s.at(1.6), 'glitch'); }
      else if (style === 'mask') { cue(s.at(.2), 'swish', .7); cue(s.at(1.4), 'swish', .7); }
      else { cue(s.at(style === 'scatter' ? .5 : 0), 'swish', .7); cue(s.at(1.6), 'pop', 1, 4); }
    }
    const pillW = pill ? pill.scrollWidth + 120 : 0;
    const bars = style === 'mask' ? [h2, aw].map((line) => { const bar = h('i', { class: 'bar' }); line.style.position = 'relative'; line.append(bar); return bar; }) : [];
    const wave = h('div', { class: 'wave', style: 'left: 50%; top: 60%; width: 300px; height: 300px; margin: -150px; border: 5px solid rgba(255, 255, 255, .8)' });
    if (style === 'giant') { h2.style.fontSize = '78px'; root.append(wave); }
    const scatter = words.map((w, i) => ({ x: (rnd(i + b0) * 2 - 1) * 760, y: (rnd(i + b0 + 40) * 2 - 1) * 400, r: (rnd(i + b0 + 80) * 2 - 1) * 50, s: .5 + rnd(i + b0 + 9) }));
    return (u) => {
      const tb = u / BEAT;
      if (style === 'scatter') {
        words.forEach((w, i) => {
          const k = spring(u - B(.5 + i * .07), 1.5, .55), sc = scatter[i];
          w.style.opacity = clamp((tb - i * .06) / .2);
          w.style.transform = `translate(${sc.x * (1 - k)}px, ${sc.y * (1 - k)}px) rotate(${sc.r * (1 - k)}deg) scale(${lerp(sc.s, 1, k)})`;
          w.style.filter = k < .7 ? `blur(${(1 - k) * 6}px)` : '';
        });
        P(ans, u - B(1.7), { ...POP, b: 10 });
      } else if (style === 'type') {
        typed.textContent = q.slice(0, Math.round(clamp((tb - .15) / 1.2) * q.length));
        h2.lastChild.style.opacity = tb < 1.5 || tb % 1 < .5 ? 1 : 0;
        ans.style.transform = `translateY(${(1 - spring(u - B(1.6), 1.8, .6)) * 110}%)`;
      } else if (style === 'drop' || zoom) {
        words.forEach((w, i) => {
          const k = spring(u - B(i * .09), 2, .5);
          w.style.opacity = clamp((u - B(i * .09)) / .1);
          w.style.transform = `translateY(${(1 - k) * -320}px) rotateX(${(1 - k) * 80}deg)`;
        });
        if (zoom) {
          P(sel, u - B(.9), POP);
          const z = inq((tb - 2.6) / 1.4);
          if (z > 0) sel.style.transform = `scale(${1 + 9 * z})`;
          h2.style.opacity = 1 - clamp(z * 4);
          sel.style.filter = z > .3 ? `blur(${(z - .3) * 30}px)` : '';
          if (z > 0) sel.style.opacity = 1 - smooth(.75, 1, z);
        } else P(ans, u - B(1.6), POP);
      } else if (style === 'slam') {
        const k1 = spring(u - B(.1), 1.6, .5), k2 = spring(u - B(.55), 1.6, .5), hit = u - B(.95);
        h2.style.transform = `translateX(${(1 - k1) * -1700}px)`;
        aw.style.transform = `translateX(${(1 - k2) * 1700}px)`;
        h2.style.filter = mb(clamp(1 - k1)); aw.style.filter = mb(clamp(1 - k2));
        box.style.translate = hit > 0 ? `${Math.exp(-hit / .08) * 22 * Math.sin(hit * 80)}px 0` : '';
      } else if (style === 'giant') { // the question drops in; the answer falls from the sky and hits
        words.forEach((w, i) => { const k = spring(u - B(i * .08), 2, .5); w.style.opacity = clamp((u - B(i * .08)) / .1); w.style.transform = `translateY(${(1 - k) * -200}px)`; });
        const f = inq((tb - 1.4) / .35), hit = u - B(1.75);
        ans.style.opacity = clamp((tb - 1.4) / .1);
        ans.style.transform = `scale(${hit < 0 ? lerp(5, 1, f) : 1 + .08 * Math.exp(-hit / .1) * Math.sin(hit * 50)})`;
        ans.style.filter = hit < 0 ? `blur(${(1 - f) * 16}px)` : '';
        box.style.translate = hit > 0 ? `0 ${Math.exp(-hit / .1) * 26 * Math.sin(hit * 70)}px` : '';
        const w2 = clamp(hit / .7);
        wave.style.opacity = hit > 0 ? (1 - w2) * .9 : 0;
        wave.style.transform = `scale(${lerp(.5, 9, out(w2))})`;
      } else if (style === 'glitch') { // shifted slices and split colours, a few frames a second, then clean
        const jit = (tb < 1.1 || (tb > 1.6 && tb < 2.2)), seed = Math.floor((s.t0 + u) * 24);
        words.forEach((w, i) => { w.style.opacity = clamp((tb - i * .06) / .1); });
        for (const [n, i] of [[h2, 0], [aw, 1]]) {
          const on = jit && (i === 0 || tb > 1.6);
          n.style.textShadow = on ? `${-6 * rnd(seed + i)}px 0 #ff2a6d, ${6 * rnd(seed + i + 7)}px 0 #05d9e8` : '';
          n.style.transform = on ? `translateX(${(rnd(seed * 3 + i) - .5) * 40}px) skewX(${(rnd(seed + 11) - .5) * 12}deg)` : '';
          n.style.clipPath = on && rnd(seed + 5 + i) > .5 ? `inset(${rnd(seed + 2) * 60}% 0 ${rnd(seed + 3) * 30}% 0)` : '';
        }
        aw.style.opacity = tb > 1.6 ? 1 : 0;
      } else if (style === 'mask') { // a bar of colour grows over each line, then gives it away
        [h2, aw].forEach((line, i) => {
          const t0 = i ? 1.4 : .2, grow = out((tb - t0) / .3), give = out((tb - t0 - .35) / .3);
          bars[i].style.transform = give > 0 ? `scaleX(${1 - give})` : `scaleX(${grow})`;
          bars[i].style.transformOrigin = give > 0 ? '100% 50%' : '0 50%';
          [...line.childNodes].forEach((c) => c !== bars[i] && c.style && (c.style.opacity = give > 0 ? 1 : 0));
          if (line === aw) ans.style.opacity = give > 0 ? 1 : 0;
        });
      } else if (style === 'pill') {
        const k = spring(u - B(.2), 1.5, .6);
        pill.style.width = `${lerp(150, pillW, k)}px`;
        pill.style.opacity = clamp((u - B(.2)) / .1);
        pill.style.color = `rgba(255, 255, 255, ${clamp((tb - .5) / .3)})`;
        P(ans, u - B(1.5), POP);
      }
      if (!zoom) {
        const e = inq((u - (s.dur - B(.5))) / B(.5));
        box.style.transform = `scale(${1 + 1.6 * e})`;
        box.style.opacity = 1 - e;
        box.style.filter = e > .02 ? `blur(${e * 18}px)` : '';
      }
    };
  });
}

// ---------- the stages: light with blobs of colour drifting; the coloured act's moving gradient; the dark act's grid
// running towards the camera, its horizon and sparks. Each act's stage opens in an iris from the middle ----------
const blobs = (n, colors, i0) => colors.map((c, i) => { const b = h('div', { class: 'blob', style: `background: ${c}` }); n.append(b); return { b, i: i + i0 }; });
const light1 = h('div', { style: 'background: #f5f5f7' }), light2 = h('div', { style: 'background: #f5f5f7' });
const color = h('div', { style: 'background: linear-gradient(120deg, #3b1f5e, #8e3f86 30%, #d0457f 55%, #3d8f9a 80%, #0e9474); background-size: 300% 300%' });
const dark = h('div', { style: 'background: radial-gradient(1400px 700px at 50% 62%, #2a1236, #0b0812 60%, #050409)' });
const LIGHT = ['rgba(179, 84, 143, .14)', 'rgba(14, 148, 116, .11)', 'rgba(113, 75, 103, .1)'];
const allBlobs = [...blobs(light1, LIGHT, 0), ...blobs(light2, LIGHT, 3), ...blobs(color, ['rgba(255, 255, 255, .2)', 'rgba(255, 214, 236, .25)', 'rgba(184, 255, 233, .2)'], 6)];
const grid = h('div', { class: 'grid' }), horizon = h('div', { class: 'abs', style: 'left: 0; right: 0; top: 450px; height: 240px; background: radial-gradient(1000px 120px at 50% 50%, rgba(255, 122, 195, .5), transparent 70%)' });
dark.append(grid, horizon);
const sparks = Array.from({ length: 70 }, (_, i) => { const n = h('i', { class: 'spark' }); dark.append(n); return { n, x: rnd(i + 300) * 1920, y: rnd(i + 400) * 1080, z: .25 + rnd(i + 500) * .75 }; });
$('#bg').append(light1, color, dark, light2);
const layerOf = { color, dark, light: light2 };
const irises = ACTS.map(() => { const n = h('div', { class: 'iris' }); $('#fx').append(n); return n; });
ACTS.forEach((a) => cue(B(a.b) - B(.2), 'whoosh', 1.2));
function renderStage(T) {
  const tb = T / BEAT, R = 1250;
  ACTS.forEach((a, i) => {
    const n = layerOf[a.look], k = out((tb - a.b + .2) / .9), next = ACTS[i + 1];
    n.style.display = tb >= a.b - .2 && !(next && tb > next.b + .8) ? '' : 'none';
    n.style.clipPath = k < 1 ? `circle(${k * R}px at 50% 50%)` : '';
    const r = k * R, w = clamp((tb - a.b + .2) / 1);
    Object.assign(irises[i].style, { left: `${960 - r}px`, top: `${540 - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, opacity: tb > a.b - .2 && w < 1 ? (1 - w) * .9 : 0,
      borderColor: a.look === 'dark' ? '#ff7ac3' : '#fff' });
  });
  for (const { b, i } of allBlobs) Object.assign(b.style, { left: `${[300, 1650, 950][i % 3] + 260 * Math.sin(T * .23 + i * 2)}px`, top: `${[230, 330, 900][i % 3] + 170 * Math.cos(T * .19 + i)}px` });
  color.style.backgroundPosition = `${50 + 50 * Math.sin(T * .4)}% ${50 + 50 * Math.cos(T * .31)}%`;
  color.style.filter = `brightness(${1 + .1 * pulse(T)})`;
  grid.style.backgroundPosition = `0 ${(T * 300) % 140}px`;
  grid.style.opacity = .55 + .45 * pulse(T);
  horizon.style.opacity = .7 + .3 * pulse(T);
  sparks.forEach((sp, i) => {
    const y = ((sp.y - T * 70 * sp.z) % 1080 + 1080) % 1080, d = 2 + 5 * sp.z;
    Object.assign(sp.n.style, { left: `${sp.x + 40 * Math.sin(T * .5 + i)}px`, top: `${y}px`, width: `${d}px`, height: `${d}px`, opacity: (.25 + .75 * sp.z) * (.55 + .45 * Math.sin(T * 3 + i)) });
  });
  for (const w of wipes) {
    const k = (T - w.t) / B(1.1) + .5;
    w.n.style.display = k > 0 && k < 1 ? '' : 'none';
    if (k > 0 && k < 1) w.n.style.transform = `translateX(${lerp(-3000, 2400, ease(k))}px) skewX(-18deg)`;
  }
}

// =====================================================================================================================
// bars 0–4: the button beating; the logo; the name drafted, then clean; the tagline
scene(0, 16.2, (root, s) => {
  const m = mark(), rings = [0, 1, 2].map(() => h('div', { class: 'ripple' }));
  const clean = h('h1');
  const NAME = 'Odoo Debug';
  const DRAFT = [['Georgia', 'italic', 700, '#ff3b30', 150, -9, 'outline'], ['Courier New', 'normal', 700, '#34c759', 140, 7], ['Marker Felt', 'normal', 400, '#ff9500', 146, -5, 'grid'],
    ['Didot', 'italic', 400, '#af52de', 150, 10], null, ['American Typewriter', 'normal', 700, '#0a84ff', 146, -7, 'grad'], ['Chalkduster', 'normal', 400, '#ff2d55', 136, 6],
    ['Futura', 'normal', 700, '#5ac8fa', 146, -10, 'outline'], ['Snell Roundhand', 'normal', 700, '#5856d6', 160, 8], ['Georgia', 'normal', 700, '#0e9474', 146, -4]];
  const dl = [], cl = [];
  clean.append(h('span', { class: 'slot' }));
  [...NAME].forEach((ch, i) => {
    const d = h('span', { text: ch === ' ' ? '\u00a0' : ch }), c = h('span', { text: ch === ' ' ? '\u00a0' : ch });
    const st = DRAFT[i];
    if (st) {
      Object.assign(d.style, { fontFamily: `'${st[0]}'`, fontStyle: st[1], fontWeight: st[2], color: st[3], fontSize: `${st[4]}px` });
      if (st[6] === 'outline') Object.assign(d.style, { color: 'transparent', webkitTextStroke: `4px ${st[3]}` });
      if (st[6] === 'grid') Object.assign(d.style, { backgroundImage: `repeating-linear-gradient(0deg, ${st[3]} 0 3px, transparent 3px 12px), repeating-linear-gradient(90deg, ${st[3]} 0 3px, transparent 3px 12px)`, webkitBackgroundClip: 'text', color: 'transparent' });
      if (st[6] === 'grad') Object.assign(d.style, { backgroundImage: 'linear-gradient(180deg, #0a84ff, #ff2d55)', webkitBackgroundClip: 'text', color: 'transparent' });
      dl.push({ n: d, st }); cl.push(c);
    }
    clean.append(c);
  });
  const lockC = h('div', { class: 'lock' }, clean);
  const sel = h('div', { class: 'sel' }, ...[0, 1, 2, 3].map(() => h('i')));
  const tag = h('div', { class: 'tagline' }, ...'See *why* Odoo does what it does.'.split(' ').map((w) => (w.startsWith('*') ? h('span', { class: 'g', text: w.replaceAll('*', '') }) : h('span', { text: w }))));
  root.append(...rings, lockC, sel, tag, m);
  // each drafted letter where its clean one will be (it is cleaned up in place); anchors on some, like the points of a
  // path being drawn
  const rel = (n) => { const b = n.getBoundingClientRect(); return { x: b.x, y: b.y, w: b.width, h: b.height }; };
  dl.forEach((l, i) => {
    l.c = rel(cl[i]);
    Object.assign(l.n.style, { position: 'absolute', left: `${l.c.x + l.c.w / 2}px`, top: `${l.c.y + l.c.h / 2}px`, translate: '-50% -50%', lineHeight: 1, whiteSpace: 'nowrap' });
    root.append(l.n);
    const w = l.n.getBoundingClientRect().width; // no wider than its clean letter: it never touches its neighbours
    if (w > .86 * l.c.w) l.n.style.fontSize = `${l.st[4] * .86 * l.c.w / w}px`;
  });
  dl.forEach((l, i) => { l.r = rel(l.n); l.at = 4.5 + i * .5; cue(s.at(l.at), 'tick', 1.2); });
  const anchors = [0, 3, 7].flatMap((i) => [[.15, .2], [.85, .3], [.5, .95]].map(([fx, fy]) => {
    const a = h('i', { class: 'anchor', style: `color: ${dl[i].st[3]}` }); root.append(a);
    return { a, i, x: dl[i].r.x + dl[i].r.w * fx, y: dl[i].r.y + dl[i].r.h * fy };
  }));
  const slot = rel(clean.firstChild), home = { x: slot.x + 62, y: slot.y + 62 };
  const word = { x: dl[0].r.x, y: Math.min(...dl.map((l) => l.r.y)), w: dl.at(-1).r.x + dl.at(-1).r.w - dl[0].r.x };
  word.h = Math.max(...dl.map((l) => l.r.y + l.r.h)) - word.y;
  const RES = 9, TAG = 11.2;
  for (let k = 0; k < 4; k++) cue(s.at(k), 'blip', .9, [0, 2, 4, 7][k]);
  cue(s.at(4), 'swish'); cue(s.at(RES), 'shine');
  return (u) => {
    const tb = u / BEAT;
    // the button: pops, beats with a ripple; then moves into the logo's place, rounding into a square
    const beatK = tb < 4 ? Math.exp(-(tb % 1) / .18) : 0, mv = ease((tb - 4) / .8);
    const size = lerp(170, 124, mv) * (1 + .1 * beatK) * lerp(.2, 1, spring(u, 2.2, .45));
    putMark(m, lerp(960, home.x, mv), lerp(470, home.y, mv), size, lerp(.5, .26, mv), clamp(u / .1));
    rings.forEach((r, k) => {
      const ph = tb - k * .33, local = ph % 1, live = tb < 4.6 && ph > 0;
      const d = 170 + local * 380;
      Object.assign(r.style, { left: `${960 - d / 2}px`, top: `${470 - d / 2}px`, width: `${d}px`, height: `${d}px`, opacity: live ? (1 - local) * .6 : 0 });
    });
    // the draft: each letter pops, tilted, on its half beat; the box on the newest, then on all; then each cleaned up
    dl.forEach((l, i) => {
      const a = spring(u - B(l.at), 2.4, .45), ck = ease((tb - RES - i * .22) / .3);
      l.n.style.opacity = clamp((tb - l.at) / .1) * (1 - ck);
      l.n.style.transform = `scale(${lerp(1.25, 1, a) * lerp(1, .9, ck)}) rotate(${l.st[5] * lerp(3, .6, a) * (1 - ck)}deg)`;
      l.n.style.filter = ck > .05 ? `blur(${ck * 10}px)` : '';
      cl[i].style.opacity = ck;
      cl[i].style.transform = `scale(${lerp(1.15, 1, ck)})`;
    });
    for (const an of anchors) { const l = dl[an.i]; an.a.style.opacity = clamp((tb - l.at - .2) / .2) * (1 - clamp((tb - RES - an.i * .22) / .2)); Object.assign(an.a.style, { left: `${an.x}px`, top: `${an.y}px` }); }
    const k = dl.findLastIndex((l) => tb >= l.at);

      p.n.style.opacity = tb < t0 || pull >= 1 ? 0 : clamp((tb - t0) / .15) * (1 - smooth(.7, 1, pull));
      p.n.style.transform = `translate(${cx - p.x}px, ${cy - p.y}px) scale(${lerp(.2, 1, clamp(k * 1.2)) * lerp(1, .1, pull)}) rotate(${(1 - clamp(k)) * (i % 2 ? 30 : -30) + pull * (i % 2 ? 40 : -40)}deg)`;
    });
    // the closing title: the name letter by letter out of a blur, the tagline, the button, the sticker
    letters.forEach((l, i) => { const k = out((tb - LAND - .2 - i * .1) / .4); l.style.opacity = k; l.style.filter = k < 1 ? `blur(${(1 - k) * 14}px)` : ''; l.style.transform = `translateX(${(1 - k) * -30}px)`; });
    P(sub, u - B(LAND + 1.7), RISE);
    P(cta, u - B(LAND + 2.6), { s: .6, y: 40, f: 2, z: .5 });
    P(url, u - B(LAND + 3.2), RISE);
    P(free, u - B(LAND + 3.6), { s: .1, r: -60, f: 2.4, z: .42 });
    free.style.rotate = '-10deg';
  };
});

// ---------------------------------------------------------------------------------------------------------------------
const DURATION = B(202);
window.renderAt = async (T) => {
  renderStage(T);
  for (const sc of scenes) {
    const live = T >= sc.t0 && T < sc.t1;
    sc.root.style.display = live ? '' : 'none';
    if (live) sc.render(T - sc.t0);
  }
  for (const c of caps) {
    if (T < c.t0 - .05 || T > c.t1 + .4) { c.n.style.opacity = 0; continue; }
    const a = spring(T - c.t0, 2, .6), b = smooth(c.t1, c.t1 + .3, T);
    c.n.style.opacity = clamp((T - c.t0) / .12) * (1 - b);
    c.n.style.transform = `translateY(${(1 - a) * 60 + b * 20}px) scale(${lerp(.9, 1, a)})`;
  }
  $('#fade').style.opacity = smooth(DURATION - .6, DURATION, T); // to the stage's colour: the film loops on its first frame
};
window.DURATION = DURATION;
window.POSTER_AT = B(199);
window.MUSIC = { duration: DURATION, beat: BEAT, sfx: SFX.sort((a, b) => a.t - b.t),
  marks: { riser: [B(12), B(16)], drop: B(16), A: [B(40), B(80)], B: [B(80), B(120)], C: [B(120), B(168)], D: [B(168), B(176)],
    break: [B(176), B(184)], riser2: [B(180), B(184)], drop2: B(184), land: B(192), end: DURATION, heads: [40, 56, 68, 80, 92, 108, 120, 136, 148, 168].map(B) } };
await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
await window.renderAt(0);
window.ready = true;
</script>
